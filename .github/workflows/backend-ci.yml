name: Backend CI (Spring Boot)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

jobs:
  backend-build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '23'
          cache: 'maven'
          cache-dependency-path: FullStack/Backend/pom.xml

      - name: Run Maven build and JUnit tests
        working-directory: FullStack/Backend
        run: |
          sed -i 's/\r$//' mvnw
          chmod +x mvnw
          ./mvnw -B test
